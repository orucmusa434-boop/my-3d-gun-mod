name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP Project
      run: |
        unzip -o tacticalarms-forge-1.20.1-project.zip -d extracted_mod
        cd extracted_mod
        chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        cd extracted_mod
        ./gradlew build || gradle build

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v3
      with:
        name: forge-1.20.1-mod
        path: extracted_mod/build/libs/*.jar

        
