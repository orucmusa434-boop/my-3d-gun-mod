name: Build Forge Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract ZIP Project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Bulunan zip dosyası: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d extracted_mod
        cd extracted_mod
        chmod +x gradlew || true

    - name: Build with Gradle
      run: |
        cd extracted_mod
        ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v3
      with:
        name: forge-1.20.1-mod
        path: extracted_mod/build/libs/*.jar
